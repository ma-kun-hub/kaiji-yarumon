name: Rename LP to index.html

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Rename LP file to index.html
        run: |
          mv kai-shi-yarumontu-lp.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html kai-shi-yarumontu-lp.html
          git commit -m "kai-shi-yarumontu-lp.html を index.html に名前変更"
          git push
