name: LPをindex.htmlに名前変更
on:
  push:
    branches: [gh-pages]
    paths:
      - '.github/workflows/rename-lp.yml'
  workflow_dispatch:
jobs:
  rename:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: index.htmlに名前変更
        run: |
          set -e
          rm -f index.html
          git mv kai-shi-yarumontu-lp.html index.html
          git add -A
          git status --short
      - name: コミットしてプッシュ
        run: |
          set -e
          git config user.name "ma-kun-hub"
          git config user.email "ma-kun-hub@users.noreply.github.com"
          git commit -m "kai-shi-yarumontu-lp.html を index.html に名前変更"
          git push origin HEAD:gh-pages
